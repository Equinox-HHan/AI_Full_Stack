<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta naem="description" content="equinoxmaple个人网站的注册界面">
        <link rel="stylesheet" href="register_styles.css">
        <title>equinoxmaple设计的注册界面</title>
    </head>

    <body>
        <main>
            
            <h1>Registration Page</h1>
            <p class="front-sentence">please fill out the form to continue</p>

            <form method="post" action="https:\\example.com">
                <fieldset>
                    <p>Personal Info(Required)</p>
                    <div>
                        <label for="user-first-name">First Name</label>
                        <input type="text" id="user-first-name" name="user-first-name" required>
                    </div>
                    <div>
                        <label for="user-last-name">Last Name</label>
                        <input type="text" id="user-last-name" name=""user-last-name required>
                    </div>
                    <div>
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" name="user-email" required>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="user-password" pattern="[0-9A-Za-z]{8,12}" required>
                    </div>
                </fieldset>

                <fieldset>
                    <div class="signal-choose">
                        <legend class="account-type">Account Type</legend>
                        <input type="radio" id="Personal" name="account-type">
                        <label for="Personal">Personal</label>
                        <input type="radio" id="Business" name="account-type">
                        <label for="Business">Business</label>
                        <input type="radio" id="Education" name="account-type">
                        <label for="Education">Education</label>
                    </div>
                    <div class="choose">
                        <legend class="gender">Gender</legend>
                        <input type="radio" id="male" name="gender">
                        <label for="male">male</label>
                        <input type="radio" id="female" name="gender">
                        <label for="female">female</label>
                        <input type="radio" id="other" name="gender">
                        <label for="other">None/Other</label>
                    </div>                    
                </fieldset>

                <fieldset>
                    <p>Other Info</p>
                    <div>
                        <label for="photo">File Photo</label>
                        <input type="file" id="photo" name="photo" accept="image/*">
                    </div>
                    <div>
                        <label for="address">Your Address</label>
                        <input type="text" id="address" name="address">
                    </div>
                    <div>
                        <label for="bio">Your Bio</label>
                        <input type="text" id="bio" name="bio">
                    </div>
                    <div>
                        <label for="age">Your Age</label>
                        <input type="number" id="age" name="age" min=10 max=120>
                    </div>
                </fieldset>
            </form>

        </main>

        <footer>
            <div>
                <p class="end-sentence">全界面由equinoxmaple开发</p>
                <div class="assignment">
                    <input type="checkbox" id="privacy-agreement" name="privacy-agreement">
                    <label for="privacy-agreement">我已阅读并同意</label>
                    <a href="https://example.com">隐私条款和服务政策</a>
                </div>
            </div>
            
        </footer>
        <div class="submit">
            <button type="submit">Submit</button>
        </div>

    </body>
</html>
