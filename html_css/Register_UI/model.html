<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="equinoxmaple个人网站的注册界面">
        <link rel="stylesheet" href="model.css">
        <title>equinoxmaple设计的注册界面</title>
    </head>

    <body>
        <div class="page-container">
            <main class="card">
                <header class="card-header">
                    <h1>Registration Page</h1>
                    <p class="front-sentence">Please fill out the form to continue</p>
                </header>

                <form method="post" action="https://example.com" class="register-form">
                    <!-- 个人基本信息 -->
                    <fieldset class="form-section">
                        <legend class="section-title">Personal Info <span class="required">(Required)</span></legend>
                        
                        <div class="form-group">
                            <label for="user-first-name">First Name</label>
                            <input type="text" id="user-first-name" name="user-first-name" placeholder="John" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="user-last-name">Last Name</label>
                            <input type="text" id="user-last-name" name="user-last-name" placeholder="Doe" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="user-email">Email</label>
                            <input type="email" id="user-email" name="user-email" placeholder="john.doe@example.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="user-password" pattern="[0-9A-Za-z]{8,12}" placeholder="8-12 characters" required>
                        </div>
                    </fieldset>

                    <!-- 选项分类 -->
                    <fieldset class="form-section">
                        <div class="option-group">
                            <span class="group-label">Account Type</span>
                            <div class="radio-options">
                                <label class="radio-item">
                                    <input type="radio" id="Personal" name="account-type" checked>
                                    <span>Personal</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" id="Business" name="account-type">
                                    <span>Business</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" id="Education" name="account-type">
                                    <span>Education</span>
                                </label>
                            </div>
                        </div>

                        <div class="option-group">
                            <span class="group-label">Gender</span>
                            <div class="radio-options">
                                <label class="radio-item">
                                    <input type="radio" id="male" name="gender">
                                    <span>Male</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" id="female" name="gender">
                                    <span>Female</span>
                                </label>
                                <label class="radio-item">
                                    <input type="radio" id="other" name="gender" checked>
                                    <span>Other</span>
                                </label>
                            </div>
                        </div>                    
                    </fieldset>

                    <!-- 其他信息 -->
                    <fieldset class="form-section">
                        <legend class="section-title">Other Info</legend>
                        
                        <div class="form-group">
                            <label for="photo">Profile Photo</label>
                            <input type="file" id="photo" name="photo" accept="image/*" class="file-input">
                        </div>
                        
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" placeholder="123 Main St">
                        </div>
                        
                        <div class="form-group">
                            <label for="bio">Bio</label>
                            <textarea id="bio" name="bio" rows="3" placeholder="Tell us about yourself..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" min="10" max="120" placeholder="25">
                        </div>
                    </fieldset>

                    <!-- 条款与提交按钮（放入form内部） -->
                    <div class="form-footer">
                        <div class="assignment">
                            <label class="checkbox-item">
                                <input type="checkbox" id="privacy-agreement" name="privacy-agreement" required>
                                <span>我已阅读并同意 <a href="https://example.com" target="_blank">隐私条款和服务政策</a></span>
                            </label>
                        </div>

                        <button type="submit" class="submit-btn">Submit</button>
                    </div>
                </form>
            </main>

            <footer>
                <p class="end-sentence">全界面由 equinoxmaple 开发</p>
            </footer>
        </div>
    </body>
</html>
